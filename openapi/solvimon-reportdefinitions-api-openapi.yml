openapi: 3.1.0
info:
  title: Configuration alertRules reportDefinitions API
  version: 1.0.0
servers:
- url: https://test.api.solvimon.com
  description: The TEST environment for our API
- url: https://api.solvimon.com
  description: The live environment for our API
tags:
- name: reportDefinitions
paths:
  /v{version}/report-definitions:
    get:
      operationId: getReportDefinitions
      summary: Get all ReportDefinitions
      tags:
      - reportDefinitions
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: limit
        in: query
        description: The amount of records shown in the list
        required: false
        schema:
          type: integer
      - name: page
        in: query
        description: The page which is going to be shown
        required: false
        schema:
          type: integer
      - name: order_by
        in: query
        description: The parameter by which the response is ordered.
        required: false
        schema:
          type: string
      - name: order_direction
        in: query
        description: The order direction by which the response is ordered.
        required: false
        schema:
          type: string
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDefinitionResponseWrapper'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    ApiErrorResourceType:
      type: string
      enum:
      - CUSTOMER
      - CUSTOM_FIELD
      - PLATFORM
      - PLATFORM_UPTODATE
      - METER
      - METER_VALUE
      - METER_PROPERTY
      - METER_VALUE_CALCULATION
      - INGEST_DATA
      - METER_DATA
      - CHARGE_DATA
      - PERSIST_DATA
      - ADJUSTMENT_DATA
      - PRODUCT_CATEGORY
      - PRODUCT
      - PRODUCT_ITEM
      - PRICING
      - PRICING_GROUP
      - PRICING_ITEM
      - PRICING_ITEM_CONFIG
      - PRICING_PLAN_SUBSCRIPTION
      - PRICING_PLAN_SUBSCRIPTION_GROUP
      - PRICING_PLAN_SCHEDULE
      - PRICING_PLAN
      - PRICING_PLAN_VERSION
      - QUOTE
      - QUOTE_VERSION
      - QUOTE_TEMPLATE
      - API_KEY
      - USER
      - ROLE
      - PROXY_USER
      - EXTERNAL_CREDENTIALS
      - TOKEN
      - INVOICE
      - E_INVOICE
      - PDF
      - BILLING_ENTITY
      - FEATURE
      - MEMBERSHIP
      - PAYMENT
      - PAYMENT_ACCEPTOR
      - PAYMENT_METHOD
      - PAYMENT_METHOD_OPTIONS
      - PAYMENT_SCHEDULE
      - PAYMENT_REQUEST
      - INTEGRATION
      - WEBHOOK
      - FILE
      - FILE_PROCESSING_SETTINGS
      - TEAM
      - DOWNLOAD_URL
      - CSV_REPORT
      - REPORT
      - REPORT_GENERATE_REQUEST
      - REPORT_CONFIGURATION
      - REPORT_SUBSCRIPTION
      - REPORT_DEFINITION
      - ACCOUNT_GROUP
      - ENTITY
      - EVENT_TRACE
      - EVENT_TRACE_LINK
      - PRICING_CATEGORY
      - CONTACT
      - ALERT_RULE
      - ALERT
      - AUDIT_RECORD
      - PORTAL_URL
      - AUTHENTICATION_PROVIDER
      - REPROCESS
      - APPROVAL_POLICY
      - APPROVAL_REQUEST
      - BULK_ACTION
      - COUPON
      - PROMOTION_CODE
      - WALLET
      - WALLET_TYPE
      - WALLET_GRANT
      - WORKFLOW
      - WORKFLOW_TRIGGER
      - WORKFLOW_ACTION
      - CREDIT_TYPE
      - SIGNATURE_REQUEST
      - ATTACHMENT
      - DOCUMENT
      title: ApiErrorResourceType
    ReportParameterName:
      type: string
      enum:
      - report_date
      - from_date
      - to_date
      - updated_to_final_from_date
      - updated_to_final_to_date
      - meter
      - meter_id
      - customer_id
      - invoice_id
      - statuses
      title: ReportParameterName
    ReportDefinitionReportCode:
      type: string
      enum:
      - INVOICE
      - INVOICE_USAGE
      - INVOICE_HEADER
      - INVOICE_LINE
      - INVOICE_TAX
      - INVOICE_COMMITMENT
      - CHILD_PARENT_BREAKDOWN
      - CHILD_PARENT_BREAKDOWN_PLATFORM
      - NOT_MATCHED_METER_DATA
      - DUPLICATE_METER_DATA
      - METERING
      - CUSTOMER
      - PRODUCT
      - PRICING_PLAN_SUBSCRIPTION
      - PAYMENT
      - PRICING
      - REVENUE_RECOGNITION
      - CLAUSES
      title: ReportDefinitionReportCode
    ReportParameter:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/ReportParameterName'
        type:
          $ref: '#/components/schemas/ReportParameterType'
        required:
          type: boolean
      title: ReportParameter
    ReportParameterType:
      type: string
      enum:
      - CUSTOMER_ID
      - INVOICE_ID
      - METER_ID
      - LOCALE_DATE
      - TIMESTAMP
      - INVOICE_STATUSES
      title: ReportParameterType
    ApiErrorCode:
      type: string
      enum:
      - RESOURCE_NOT_FOUND
      - RESOURCES_NOT_FOUND
      - UNABLE_TO_PROCESS_INSTRUCTIONS
      - BAD_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - RESOURCE_ALREADY_EXISTS
      - CUSTOM_FIELD_VALUE_ALREADY_EXISTS
      - COULD_NOT_CREATE_RESOURCE
      - COULD_NOT_UPDATE_RESOURCE
      - COULD_NOT_DELETE_RESOURCE
      - MISSING_VERSION
      - UNSUPPORTED_VERSION
      - UNAUTHORISED
      - CUSTOMER_NOT_FOUND
      - PLATFORM_NOT_FOUND
      - PRICING_PLAN_NOT_FOUND
      - PRODUCT_NOT_FOUND
      - PRODUCT_ITEM_NOT_FOUND
      - PRICING_NOT_FOUND
      - PRICING_ITEM_NOT_FOUND
      - USER_NOT_FOUND
      - METER_NOT_FOUND
      - METER_VALUE_NOT_FOUND
      - METER_PROPERTY_NOT_FOUND
      - PRICING_ITEM_SUMMARIES_NOT_FOUND
      - MISSING_ID
      - INVALID_ID
      - MISSING_REFERENCE
      - MISSING_FIELD
      - INVALID_FIELD
      - INVALID_OPERATION
      - INTERNAL_ERROR
      - USER_NOT_ALLOWED
      - IDEMPOTENCY_CHECK_FAILED
      - INVALID_REQUEST
      title: ApiErrorCode
    ReportColumn:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        order:
          type:
          - integer
          - 'null'
        default:
          type:
          - boolean
          - 'null'
        optional:
          type:
          - boolean
          - 'null'
      title: ReportColumn
    ApiErrorType:
      type: string
      enum:
      - API_ERROR
      - INVALID_REQUEST
      title: ApiErrorType
    ReportDefinitionResponseWrapper:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReportDefinition'
        limit:
          type:
          - integer
          - 'null'
        page:
          type:
          - integer
          - 'null'
        total_number_of_pages:
          type:
          - integer
          - 'null'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
      - data
      - links
      title: ReportDefinitionResponseWrapper
    ApiError:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ApiErrorType'
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        field:
          type:
          - string
          - 'null'
        message:
          type: string
        resource_id:
          type:
          - string
          - 'null'
        resource_type:
          oneOf:
          - $ref: '#/components/schemas/ApiErrorResourceType'
          - type: 'null'
      required:
      - type
      - code
      - message
      title: ApiError
    PaginationLinks:
      type: object
      properties:
        first:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        current:
          type:
          - string
          - 'null'
        next:
          type:
          - string
          - 'null'
      title: PaginationLinks
    ReportDefinitionCategory:
      type: string
      enum:
      - INVOICE
      - PLATFORM
      title: ReportDefinitionCategory
    ReportDefinition:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        report_code:
          $ref: '#/components/schemas/ReportDefinitionReportCode'
        category:
          oneOf:
          - $ref: '#/components/schemas/ReportDefinitionCategory'
          - type: 'null'
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        file_name_format:
          type:
          - string
          - 'null'
        run_types:
          type:
          - array
          - 'null'
          items:
            type: string
        target_resource_types:
          type:
          - array
          - 'null'
          items:
            type: string
        columns:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportColumn'
        one_off_parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportParameter'
        scheduled_parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportParameter'
        trigger_parameters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReportParameter'
      title: ReportDefinition
  securitySchemes:
    API-Key:
      type: apiKey
      in: header
      name: X-API-KEY
    JWT-Authentication:
      type: http
      scheme: bearer

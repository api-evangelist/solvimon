    ProductCategoryUpdateRequestTaxCategory:
      type: string
      enum:
      - STANDARD
      - NO_TAX
      - EXEMPT
      description: The default tax category applied to the products in the product category.
      title: ProductCategoryUpdateRequestTaxCategory
    ProductCategoryUpdateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        description:
          type:
          - string
          - 'null'
        tax_category:
          oneOf:
          - $ref: '#/components/schemas/ProductCategoryUpdateRequestTaxCategory'
          - type: 'null'
          description: The default tax category applied to the products in the product category.
        display_order:
          type:
          - integer
          - 'null'
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
      title: ProductCategoryUpdateRequest
    ProductCategoryResponseWrapper:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'
        limit:
          type:
          - integer
          - 'null'
        page:
          type:
          - integer
          - 'null'
        total_number_of_pages:
          type:
          - integer
          - 'null'
        links:
          $ref: '#/components/schemas/PaginationLinks'
      required:
      - data
      - links
      title: ProductCategoryResponseWrapper
    ProductCategory:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        description:
          type:
          - string
          - 'null'
        tax_category:
          oneOf:
          - $ref: '#/components/schemas/ProductCategoryTaxCategory'
          - type: 'null'
          description: The default tax category applied to the products in the product category.
        display_order:
          type:
          - integer
          - 'null'
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
      title: ProductCategory
    ProductCategoryCreateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        description:
          type:
          - string
          - 'null'
        tax_category:
          oneOf:
          - $ref: '#/components/schemas/ProductCategoryCreateRequestTaxCategory'
          - type: 'null'
          description: The default tax category applied to the products in the product category.
        display_order:
          type:
          - integer
          - 'null'
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
      required:
      - name
      - reference
      title: ProductCategoryCreateRequest
    SearchCreateRequest:
      type: object
      properties:
        search_fields:
          type: array
          items:
            $ref: '#/components/schemas/SearchFieldCreateRequest'
        filter_fields:
          type: array
          items:
            $ref: '#/components/schemas/FilterFieldCreateRequest'
        selection_rule_fields:
          type: array
          items:
            $ref: '#/components/schemas/SelectionRuleFieldCreateRequest'
      title: SearchCreateRequest
    PaginationLinks:
      type: object
      properties:
        first:
          type:
          - string
          - 'null'
        previous:
          type:
          - string
          - 'null'
        current:
          type:
          - string
          - 'null'
        next:
          type:
          - string
          - 'null'
      title: PaginationLinks
    ApiErrorCode:
      type: string
      enum:
      - RESOURCE_NOT_FOUND
      - RESOURCES_NOT_FOUND
      - UNABLE_TO_PROCESS_INSTRUCTIONS
      - BAD_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - RESOURCE_ALREADY_EXISTS
      - CUSTOM_FIELD_VALUE_ALREADY_EXISTS
      - COULD_NOT_CREATE_RESOURCE
      - COULD_NOT_UPDATE_RESOURCE
      - COULD_NOT_DELETE_RESOURCE
      - MISSING_VERSION
      - UNSUPPORTED_VERSION
      - UNAUTHORISED
      - CUSTOMER_NOT_FOUND
      - PLATFORM_NOT_FOUND
      - PRICING_PLAN_NOT_FOUND
      - PRODUCT_NOT_FOUND
      - PRODUCT_ITEM_NOT_FOUND
      - PRICING_NOT_FOUND
      - PRICING_ITEM_NOT_FOUND
      - USER_NOT_FOUND
      - METER_NOT_FOUND
      - METER_VALUE_NOT_FOUND
      - METER_PROPERTY_NOT_FOUND
      - PRICING_ITEM_SUMMARIES_NOT_FOUND
      - MISSING_ID
      - INVALID_ID
      - MISSING_REFERENCE
      - MISSING_FIELD
      - INVALID_FIELD
      - INVALID_OPERATION
      - INTERNAL_ERROR

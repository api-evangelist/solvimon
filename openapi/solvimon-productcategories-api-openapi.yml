    ApiErrorType:
      type: string
      enum:
      - API_ERROR
      - INVALID_REQUEST
      title: ApiErrorType
    FilterFieldCreateRequest:
      type: object
      properties:
        name:
          type: string
        reference:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
        values:
          type: array
          items:
            type: string
      title: FilterFieldCreateRequest
    ApiError:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ApiErrorType'
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        field:
          type:
          - string
          - 'null'
        message:
          type: string
        resource_id:
          type:
          - string
          - 'null'
        resource_type:
          oneOf:
          - $ref: '#/components/schemas/ApiErrorResourceType'
          - type: 'null'
      required:
      - type
      - code
      - message
      title: ApiError
    ProductCategoryCreateRequestTaxCategory:
      type: string
      enum:
      - STANDARD
      - NO_TAX
      - EXEMPT
      description: The default tax category applied to the products in the product category.
      title: ProductCategoryCreateRequestTaxCategory
    SelectionRuleFieldCreateRequest:
      type: object
      properties:
        name:
          type: string
        value:
          type:
          - string
          - 'null'
      title: SelectionRuleFieldCreateRequest
    SearchFieldCreateRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        value:
          type: string
        wildcard_start:
          type: boolean
        wildcard_end:
          type: boolean
        ignore_case:
          type: boolean
      title: SearchFieldCreateRequest
  securitySchemes:
    API-Key:
      type: apiKey
      in: header
      name: X-API-KEY
    JWT-Authentication:
      type: http
      scheme: bearer

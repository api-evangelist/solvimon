          type:
          - string
          - 'null'
          description: The uniquely assigned purchase order number.
        customer_id:
          type: string
          description: The ID of the customer.
        customer_reference:
          type: string
          description: The reference of the customer.
        customer:
          oneOf:
          - $ref: '#/components/schemas/Customer'
          - type: 'null'
        billing_entity_id:
          type:
          - string
          - 'null'
          description: The resource ID of the billing entity that is assigned to the subscription. If not set, the default platform value will be taken.
        billing_entity_reference:
          type:
          - string
          - 'null'
          description: The reference of the billing entity that is assigned to the subscription. If not set, the default platform value will be taken.
        billing_entity:
          oneOf:
          - $ref: '#/components/schemas/BillingEntity'
          - type: 'null'
        billing_period:
          $ref: '#/components/schemas/Period'
          description: The period of the invoice. If not set, the default (platform) value will be taken.
        billing_currency:
          $ref: '#/components/schemas/PricingPlanSubscriptionBillingCurrency'
          description: The alphabetic currency code representing the type of currency used for billing. If not set, the default (platform) value will be taken.
        due_date_configuration:
          $ref: '#/components/schemas/DueDate'
          description: The configuration of the due date of the invoices in the subscriptions. If not set, the default (platform) value will be taken.
        initial_term:
          $ref: '#/components/schemas/Period'
          description: The initial term for the agreement.
        renewal_term:
          $ref: '#/components/schemas/Period'
          description: The renewal term after the initial term.
        auto_renewal:
          type:
          - boolean
          - 'null'
          description: Indicates if the subscription renews automatically.
        type:
          oneOf:
          - $ref: '#/components/schemas/PricingPlanSubscriptionType'
          - type: 'null'
        variant:
          $ref: '#/components/schemas/PricingPlanSubscriptionVariant'
        billing_time:
          oneOf:
          - $ref: '#/components/schemas/PricingPlanSubscriptionBillingTime'
          - type: 'null'
          description: The moment the invoices for the subscription should be created. If not set, the default platform value will be taken.
        combine:
          type:
          - boolean
          - 'null'
          description: Indication whether invoices of different subscriptions should be combined, if possible. If not set, the default platform value will be taken.
        quote_version_id:
          type:
          - string
          - 'null'
          description: The reference to the version of the quote where the subscription is linked to.
        upgraded_from_pricing_plan_subscription_id:
          type:
          - string
          - 'null'
          description: The resource ID of the subscription that this subscription is upgraded from.
        upgraded_to_pricing_plan_subscription_id:
          type:
          - string
          - 'null'
          description: The resource ID of the subscription that this subscription is upgraded to.
        payment_acceptor_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The resource ID(s) of the specific payment acceptors for the subscription
        payment_acceptors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PaymentAcceptor'
        pricing_plan_schedule_infos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PricingPlanScheduleInfo'
        description:
          type:
          - string
          - 'null'
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomFieldValue'
        init_invoice_on_hold:
          type: boolean
        payment_method_id:
          type: string
          description: The ID of the payment method to be used to pay for invoices of this subscription.
        pricing_plan_subscription_group_id:
          type:
          - string
          - 'null'
          description: The resource ID of the pricing plan subscription group where the subscription is part of
        pricing_plan_subscription_group:
          oneOf:
          - $ref: '#/components/schemas/PricingPlanSubscriptionGroup'
          - type: 'null'
        forward_customer_id:
          type:
          - string
          - 'null'
          description: The reference to the customer that needs to be used for the invoice (for FORWARD_BILLING)
        forward_customer:
          oneOf:
          - $ref: '#/components/schemas/Customer'
          - type: 'null'
        inactive_periods:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InactivePeriod'
        display_invoice_sub_lines_per_processing_only_customer:
          type:
          - boolean
          - 'null'
        replicate_meter_data_ingest_to_parent:
          type:
          - boolean
          - 'null'
        sales_tax_percentage:
          type:
          - string
          - 'null'
          description: Sales tax for this subscription. If provided, it will override the tax for all items on the invoice. Mandatory for US to US billing when there's no external tax integration. Optional otherwise
        next_invoice:
          oneOf:
          - $ref: '#/components/schemas/NextInvoice'
          - type: 'null'
        template:
          $ref: '#/components/schemas/TemplatePricingPlanSubscription'
          description: The configuration fields that can be used when having a template subscription.
        linked_integrations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LinkedIntegration'
        seller_details:
          $ref: '#/components/schemas/SellerDetails'
      title: PricingPlanSubscription

openapi: 3.1.0
info:
  title: Configuration alertRules platforms API
  version: 1.0.0
servers:
- url: https://test.api.solvimon.com
  description: The TEST environment for our API
- url: https://api.solvimon.com
  description: The live environment for our API
tags:
- name: platforms
paths:
  /v{version}/platforms/{resourceId}:
    get:
      operationId: getPlatformsByResourceId
      summary: Get your platform details
      tags:
      - platforms
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: patchPlatformsByResourceId
      summary: Update your platform
      tags:
      - platforms
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Platform'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdateRequest'
  /v{version}/platforms/{resourceId}/entitlements:
    get:
      operationId: getPlatformsByResourceIdEntitlements
      summary: Get your platform entitlements
      tags:
      - platforms
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlements'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v{version}/platforms/{resourceId}/currencies:
    get:
      operationId: getPlatformsByResourceIdCurrencies
      summary: Get currencies for platform
      description: Requires the CURRENCIES.VIEW permission.
      tags:
      - platforms
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v{version}/platforms/{resourceId}/up-to-date:
    get:
      operationId: getPlatformsByResourceIdUpToDate
      summary: Get up-to-date for platform
      tags:
      - platforms
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUpToDate'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    PortalUrlSettings:
      type: object
      properties:
        expiry_period:
          $ref: '#/components/schemas/Period'
      title: PortalUrlSettings
    Platform:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        reference:
          type: string
        status:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        entity_id:
          type:
          - string
          - 'null'
          description: The resource ID of the entity.
        default_billing_entity_id:
          type:
          - string
          - 'null'
          description: The resource ID of the billing entity.
        default_product_tax_category:
          $ref: '#/components/schemas/PlatformDefaultProductTaxCategory'
          description: The default tax category that will be applied to the product.
        account_group_id:
          type: string
        default_pricing_plan_subscription_settings:
          $ref: '#/components/schemas/PlatformPricingPlanSubscriptionSettings'
          description: The default configuration when creating a pricing plan subscription.
        crm_integrations:
          $ref: '#/components/schemas/CrmIntegrations'
          description: The associated crm integrations
        branding:
          $ref: '#/components/schemas/Branding'
          description: Custom branding for the platform, the logo & colors can be set
        invoice_settings:
          $ref: '#/components/schemas/InvoiceSettings'
          description: The settings of the invoice
        reporting_currency:
          $ref: '#/components/schemas/PlatformReportingCurrency'
          description: currency for reporting on platform level
        default_pricing_currency:
          $ref: '#/components/schemas/PlatformDefaultPricingCurrency'
          description: initial/default currency when creating pricingPlanVersions
        quote_settings:
          $ref: '#/components/schemas/QuoteSettings'
          description: The settings of the quote
        rounding_settings:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RoundingSetting'
          description: Allow platforms to configure rounding behavior for different kinds of objects.
        reprocessing_settings:
          $ref: '#/components/schemas/ReprocessingSettings'
          description: Settings for reprocessing
        processing_settings:
          $ref: '#/components/schemas/ProcessingSettings'
          description: Settings for processing
        default_portal_url_settings:
          $ref: '#/components/schemas/DefaultPortalUrlSettings'
          description: The settings related with portal
      title: Platform
    Period:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/PeriodType'
        value:
          type:
          - integer
          - 'null'
      title: Period
    RoundingSettingUpdateRequest:
      type: object
      properties:
        rounding_target:
          $ref: '#/components/schemas/RoundingSettingUpdateRequestRoundingTarget'
        rounding_mode:
          $ref: '#/components/schemas/RoundingSettingUpdateRequestRoundingMode'
      title: RoundingSettingUpdateRequest
    DueDateType:
      type: string
      enum:
      - PERIOD_AFTER_INVOICE_DATE
      - END_OF_THE_MONTH
      title: DueDateType
    DocumentNumberConfigurationResetPeriod:
      type: object
      properties:
        type:
          type: string
        month:
          oneOf:
          - $ref: '#/components/schemas/DocumentNumberConfigurationResetPeriodMonth'
          - type: 'null'
      title: DocumentNumberConfigurationResetPeriod
    Entitlements:
      type: object
      properties:
        entitlements:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntitlementSummaryItem'
        pricing_plan_subscription_entitlements:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EntitlementSummary'
      title: Entitlements
    InvoiceSettingsInvoiceDateDeterminationType:
      type: string
      enum:
      - AT_END_OF_BILLING_PERIOD
      - AFTER_END_OF_BILLING_PERIOD

components:
  schemas:
    IndividualCreateRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
        residential_address:
          $ref: '#/components/schemas/Address'
      title: IndividualCreateRequest
    CustomerWalletBalanceStatus:
      type: object
      properties:
        wallet_id:
          type:
          - string
          - 'null'
        wallet_balance:
          oneOf:
          - $ref: '#/components/schemas/WalletBalanceStatus'
          - type: 'null'
      title: CustomerWalletBalanceStatus
    TaxIdValidationValid:
      type: string
      enum:
      - VALID
      - NOT_VALID
      - UNKNOWN
      title: TaxIdValidationValid
    TaxIdValidation:
      type: object
      properties:
        id:
          type: string
        validation_date:
          type: string
        source:
          type: string
        valid:
          $ref: '#/components/schemas/TaxIdValidationValid'
        message:
          type:
          - string
          - 'null'
      title: TaxIdValidation
    LinkedIntegration:
      type: object
      properties:
        id:
          type: string
        link_details:
          type: array
          items:
            $ref: '#/components/schemas/LinkDetail'
      title: LinkedIntegration
    WalletBalanceStatus:
      type: object
      properties:
        balance:
          oneOf:
          - $ref: '#/components/schemas/WalletBalanceValue'
          - type: 'null'
        reserved_balance:
          oneOf:
          - $ref: '#/components/schemas/WalletBalanceValue'
          - type: 'null'
        open_balance:
          oneOf:
          - $ref: '#/components/schemas/WalletBalanceValue'
          - type: 'null'
        balance_at:
          type:
          - string
          - 'null'
      title: WalletBalanceStatus
    IntegrationDetails:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        reference:
          type:
          - string
          - 'null'
        payment_gateway_variant:
          $ref: '#/components/schemas/IntegrationDetailsPaymentGatewayVariant'
        adyen:

openapi: 3.1.0
info:
  title: Event API
  version: 1.0.0
paths:
  /v{version}/ingest/meter-data:
    get:
      operationId: getIngestMeterData
      summary: Get a list of events for provided filters
      description: Requires the METER_DATA.VIEW permission.
      tags:
        - ingest
      parameters:
        - name: version
          in: path
          description: version
          required: true
          schema:
            type: string
            default: '1'
        - name: customer_id
          in: query
          description: The resource id of the customer.
          required: false
          schema:
            type: string
        - name: reference
          in: query
          description: The reference of the ingest.
          required: false
          schema:
            type: string
        - name: meter_id
          in: query
          description: The resource id of the meter.
          required: false
          schema:
            type: string
        - name: deleted
          in: query
          description: Filter the response by deleted field value.
          required: false
          schema:
            type: boolean
        - name: processed_details_type
          in: query
          description: 'Filter the response by processing_details.type value. Ex.: NOT_MATCHED, DUPLICATE'
          required: false
          schema:
            type: string
        - name: expand[]
          in: query
          description: The id fields of the resources that are going to be expanded.
          required: false
          schema:
            type: array
            items:
              type: string
        - name: limit
          in: query
          description: The amount of records shown in the list
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: The page which is going to be shown
          required: false
          schema:
            type: integer
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
        - name: x-platform-id
          in: header
          description: Platform ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestDataResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postIngestMeterData
      summary: Ingest an event
      description: Requires the METER_DATA.INGEST permission.
      tags:
        - ingest
      parameters:
        - name: version
          in: path
          description: version
          required: true
          schema:
            type: string
            default: '1'
        - name: cost_prediction
          in: query
          description: The option to return cost prediction.
          required: false
          schema:
            type: boolean
        - name: meter_validation
          in: query
          description: >-
            The validation strategy applied to the referenced meter. STATIC (the default) requires the meter, its values
            and properties to already exist. DYNAMIC creates the meter and its missing values/properties/enum values on
            the fly during ingest.
          required: false
          schema:
            type: string
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
        - name: x-platform-id
          in: header
          description: Platform ID.
          required: false
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeterData'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeterDataCreateRequest'

components:
  schemas:
    MeterDataType:
      type: string
      enum:
        - INGEST
        - CALCULATION
      description: The type of meter data.
      title: MeterDataType
    CustomerStatus:
      type: string
      enum:
        - DRAFT
        - ACTIVE
        - ARCHIVED
        - DEPRECATED
        - CLOSED
      title: CustomerStatus
    CustomerType:
      type: string
      enum:
        - ORGANIZATION
        - INDIVIDUAL
      description: The type of customer entity.
      title: CustomerType
    NotificationPreferenceType:
      type: string
      enum:
        - INVOICE
      description: The notification type to configure.
      title: NotificationPreferenceType
    NotificationChannelType:
      type: string
      enum:
        - EMAIL
      description: The channel type to use.
      title: NotificationChannelType
    NotificationChannel:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/NotificationChannelType'
          description: The channel type to use.
        enabled:
          type:
            - boolean
            - 'null'
          description: Whether the channel is enabled for the notification type.
      title: NotificationChannel
    NotificationPreference:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/NotificationPreferenceType'
          description: The notification type to configure.
        channels:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/NotificationChannel'
          description: The channels for this notification type.
      title: NotificationPreference
    Name:
      type: object
      properties:
        first_name:
          type:
            - string
            - 'null'
        last_name:
          type:
            - string
            - 'null'
        infix:
          type:
            - string
            - 'null'
      title: Name
    AddressCountry:
      type: string
      enum:
        - AD
        - AE
        - AF

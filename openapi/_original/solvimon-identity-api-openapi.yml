openapi: 3.1.0
info:
  title: Identity API
  version: 1.0.0
paths:
  /v{version}/oauth/token:
    post:
      operationId: postOauthToken
      summary: Obtain token for provided credentials
      tags:
        - authentication
      parameters:
        - name: version
          in: path
          description: version
          required: true
          schema:
            type: string
            default: '1'
        - name: x-platform-id
          in: header
          description: Platform ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCredentialRequestCreateRequest'
  /v{version}/oauth/demo-token:

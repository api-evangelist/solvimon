openapi: 3.1.0
info:
  title: Transaction API
  version: 1.0.0
paths:
  /v{version}/invoices:
    get:
      operationId: getInvoices
      summary: Get a list of invoices
      description: Requires the INVOICE.VIEW permission.
      tags:
        - invoices
      parameters:
        - name: version
          in: path
          description: version
          required: true
          schema:
            type: string
            default: '1'
        - name: customer_id
          in: query
          description: Filter based of customer ID
          required: false
          schema:
            type: string
        - name: statuses[]
          in: query
          description: Filter invoices based on invoice status(es)
          required: false
          schema:
            type: array
            items:
              type: string
        - name: invoice_date
          in: query
          description: Range filter for the start_at of the first schedule in the pricing plan subscription (ISO-8601).
          required: false
          schema:
            type: string
        - name: paid
          in: query
          description: Filter invoices based on whether they're paid or not (true or false)
          required: false
          schema:
            type: string
        - name: on_hold
          in: query
          description: Filter invoices based on whether they're on hold or not (true or false)
          required: false
          schema:
            type: string
        - name: pricing_plan_subscription_id
          in: query
          description: Filter invoices by the pricing plan subscription id
          required: false
          schema:
            type: string
        - name: include_periods
          in: query
          description: Indicates whether the response should include period and group data (true or false)
          required: false
          schema:
            type: boolean
        - name: include_lines
          in: query
          description: Indicates whether the response should include invoice lines (true or false)
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          description: The amount of records shown in the list
          required: false
          schema:
            type: integer
        - name: page
          in: query
          description: The page which is going to be shown
          required: false
          schema:
            type: integer
        - name: order_by
          in: query
          description: The parameter by which the response is ordered.
          required: false
          schema:
            type: string
        - name: order_direction
          in: query
          description: The order direction by which the response is ordered.
          required: false
          schema:
            type: string
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
        - name: x-platform-id
          in: header
          description: Platform ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postInvoices
      summary: Create a one-off invoice or credit invoice
      description: Requires the INVOICE.ONE_OFF.CREATE permission.
      tags:
        - invoices
      parameters:
        - name: version
          in: path
          description: version
          required: true
          schema:
            type: string
            default: '1'
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
        - name: x-platform-id
          in: header
          description: Platform ID.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'

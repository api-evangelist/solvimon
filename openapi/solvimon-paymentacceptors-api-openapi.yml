openapi: 3.2.0
info:
  title: Configuration Payment Acceptors API
  version: 1.0.0
servers:
- url: https://test.api.solvimon.com
  description: The TEST environment for our API
- url: https://api.solvimon.com
  description: The live environment for our API
tags:
- name: paymentAcceptors
paths:
  /v{version}/payment-acceptors:
    get:
      operationId: getPaymentAcceptors
      summary: Get a list of payment acceptors for provided filters
      description: Requires the PAYMENT_ACCEPTOR.VIEW permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: billing_entity_id
        in: query
        description: The resource id of the billingEntity.
        required: false
        schema:
          type: string
      - name: customer_id
        in: query
        description: The resource id of the customer.
        required: false
        schema:
          type: string
      - name: statuses[]
        in: query
        description: Filter paymentAcceptor based on status(es)
        required: false
        schema:
          type: array
          items:
            type: string
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptorResponseWrapper'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      operationId: postPaymentAcceptors
      summary: Create a payment acceptor
      description: Requires the PAYMENT_ACCEPTOR.CREATE permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptor'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAcceptorCreateRequest'
  /v{version}/payment-acceptors/payment-method-options:
    post:
      operationId: postPaymentAcceptorsPaymentMethodOptions
      summary: Retrieve payment method options for payment acceptors
      description: Requires the PAYMENT_ACCEPTOR.VIEW permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentAcceptorPaymentMethodOptions'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAcceptorPaymentMethodOptionsRequestCreateRequest'
  /v{version}/payment-acceptors/{resourceId}:
    get:
      operationId: getPaymentAcceptorsByResourceId
      summary: Get a payment acceptor by resource ID
      description: Requires the PAYMENT_ACCEPTOR.VIEW permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptor'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      operationId: deletePaymentAcceptorsByResourceId
      summary: Delete a payment acceptor
      description: Requires the PAYMENT_ACCEPTOR.DELETE permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptor'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    patch:
      operationId: patchPaymentAcceptorsByResourceId
      summary: Update the payment acceptor
      description: Requires the PAYMENT_ACCEPTOR.UPDATE permission.
      tags:
      - paymentAcceptors
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path
        description: The ID of the resource to be requested.
        required: true
        schema:
          type: string
          default: ''
      - name: X-API-KEY
        in: header
        required: true
        schema:
          type: string
      - name: x-platform-id
        in: header
        description: Platform ID.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptor'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentAcceptorUpdateRequest'
components:
  schemas:
    EInvoicingIntegrationProcessor:
      type: string
      enum:
      - AVALARA
      title: EInvoicingIntegrationProcessor
    Address:
      type: object
      properties:
        line1:
          type:
          - string
          - 'null'
        line2:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        postal_code:
          type:
          - string
          - 'null'
        state:
          type:
          - string
          - 'null'
        country:
          oneOf:
          - $ref: '#/components/schemas/AddressCountry'
          - type: 'null'
      title: Address
    ApiErrorCode:
      type: string
      enum:
      - RESOURCE_NOT_FOUND
      - RESOURCES_NOT_FOUND
      - UNABLE_TO_PROCESS_INSTRUCTIONS
      - BAD_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - RESOURCE_ALREADY_EXISTS
      - CUSTOM_FIELD_VALUE_ALREADY_EXISTS
      - COULD_NOT_CREATE_RESOURCE
      - COULD_NOT_UPDATE_RESOURCE
      - COULD_NOT_DELETE_RESOURCE
      - MISSING_VERSION
      - UNSUPPORTED_VERSION
      - UNAUTHORISED
      - CUSTOMER_NOT_FOUND
      - PLATFORM_NOT_FOUND
      - PRICING_PLAN_NOT_FOUND
      - PRODUCT_NOT_FOUND
      - PRODUCT_ITEM_NOT_FOUND
      - PRICING_NOT_FOUND
      - PRICING_ITEM_NOT_FOUND
      - USER_NOT_FOUND
      - METER_NOT_FOUND
      - METER_VALUE_NOT_FOUND
      - METER_PROPERTY_NOT_FOUND
      - PRICING_ITEM_SUMMARIES_NOT_FOUND
      - MISSING_ID
      - INVALID_ID
      - MISSING_REFERENCE
      - MISSING_FIELD
      - INVALID_FIELD
      - INVALID_OPERATION
      - INTERNAL_ERROR
      - USER_NOT_ALLOWED
      - IDEMPOTENCY_CHECK_FAILED
      - INVALID_REQUEST
      title: ApiErrorCode
    PaymentAcceptorStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      - DEPRECATED
      title: PaymentAcceptorStatus
    AdyenPaymentMethodOption:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        brand:
          type:
          - string
          - 'null'
        brands:
          type:
          - array
          - 'null'
          items:
            type: string
        funding_source:
          type:
          - string
          - 'null'
        issuers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdyenIssuer'
        store_payment_method:
          type: boolean
        configuration:
          type: object
          additionalProperties:
            type: string
      title: AdyenPaymentMethodOption
    PaymentGatewayPaymentAcceptorAdyen:
      type: object
      properties:
        auto_rescue:
          $ref: '#/components/schemas/AdyenAutoRescue'
        merchant_account:
          type:
          - string
          - 'null'
        allowed_payment_methods:
          type:
          - array
          - 'null'
          items:
            type: string
      title: PaymentGatewayPaymentAcceptorAdyen
    SystemOwnershipDetails:
      type: object
      properties:
        account_holder_id:
          type: string
        balance_account_id:
          type: string
        legal_entity_id:
          type: string
        store_id:
          type: string
      title: SystemOwnershipDetails
    PaymentAcceptorUpdateRequestStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      - DEPRECATED
      title: PaymentAcceptorUpdateRequestStatus
    ClientCredentials:
      type: object
      properties:
        client_id:
          type: string
        client_secret:
          type: string
      title: ClientCredentials
    PaymentAcceptorCreateRequestType:
      type: string
      enum:
      - BANK_ACCOUNT
      - PAYMENT_GATEWAY
      - CUSTOM_REDIRECT
      title: PaymentAcceptorCreateRequestType
    USLocal:
      type: object
      properties:
        account_number:
          type:
          - string
          - 'null'
          description: A bank account number if IBAN is not used, e.g a USA or UK bank account number
        account_type:
          oneOf:
          - $ref: '#/components/schemas/UsLocalAccountType'
          - type: 'null'
          description: The bank account type.
        bank_code:
          type:
          - string
          - 'null'
          description: A bank code that's used to identify the bank that this account belongs to
        routing_number:
          type:
          - string
          - 'null'
          description: The 9-digit code that identifies a specific financial institution for transactions in the USA.
      title: USLocal
    IntegrationLinkDetail:
      type: object
      properties:
        base_url:
          type: string
        custom_field_reference:
          type: string
      title: IntegrationLinkDetail
    AdyenAutoRescue:
      type: object
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        period:
          $ref: '#/components/schemas/Period'
      title: AdyenAutoRescue
    BankAccountType:
      type: string
      enum:
      - IBAN
      - BIC_AND_ACCOUNT_NUMBER
      - ACCOUNT_NUMBER_AND_BIC
      - US_BANK_ACCOUNT
      - US_LOCAL
      - UK_LOCAL
      - BR_LOCAL
      - AR_LOCAL
      - MX_LOCAL
      description: Determines what fields should be present in the bank account node.
      title: BankAccountType
    IntegrationStatus:
      type: string
      enum:
      - DRAFT
      - PENDING
      - TESTING
      - ACTIVE
      - ERROR
      - DEPRECATED
      - ARCHIVED
      description: The status of the integration.
      title: IntegrationStatus
    PaymentGatewayPaymentAcceptorCollectionType:
      type: string
      enum:
      - LINK
      title: PaymentGatewayPaymentAcceptorCollectionType
    LegalEntityManagerDetails:
      type: object
      properties:
        authentication:
          $ref: '#/components/schemas/AuthenticationSettings'
      title: LegalEntityManagerDetails
    PaymentAcceptor:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        billing_entity_id:
          type:
          - string
          - 'null'
          description: Resource ID of type BILLING_ENTITY
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
        reference:
          type: string
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/PaymentAcceptorType'
          - type: 'null'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        payment_gateway:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptor'
        custom_redirect:
          $ref: '#/components/schemas/PaymentAcceptorCustomRedirect'
        status:
          oneOf:
          - $ref: '#/components/schemas/PaymentAcceptorStatus'
          - type: 'null'
      title: PaymentAcceptor
    BalancePlatformDetails:
      type: object
      properties:
        account:
          type: string
        authentication:
          $ref: '#/components/schemas/AuthenticationSettings'
      title: BalancePlatformDetails
    EInvoicingCondition:
      type: object
      properties:
        field:
          type: string
          description: The field that holds the value to compare against
        comparator_type:
          $ref: '#/components/schemas/EInvoicingConditionComparatorType'
        value:
          type: string
          description: Value to check the field against. If a Comparator such as 'IN' or 'CONTAINS' is used, this can be a comma separated list of values
      title: EInvoicingCondition
    PaymentAcceptorType:
      type: string
      enum:
      - BANK_ACCOUNT
      - PAYMENT_GATEWAY
      - CUSTOM_REDIRECT
      title: PaymentAcceptorType
    AccountNumberAndBic:
      type: object
      properties:
        account_number:
          type:
          - string
          - 'null'
          description: A bank account number if IBAN is not used, e.g a USA or UK bank account number
        bank_code:
          type:
          - string
          - 'null'
          description: A bank code that's used to identify the bank that this account belongs to
        bic:
          type:
          - string
          - 'null'
          description: The ISO 9362 Business Identifier Code (BIC) of the bank account
      title: AccountNumberAndBic
    PaymentGatewayPaymentAcceptorCreateRequest:
      type: object
      properties:
        integration_id:
          type: string
          description: Resource ID of type INTEGRATION
        integration:
          oneOf:
          - $ref: '#/components/schemas/Integration'
          - type: 'null'
        store_payment_method:
          type:
          - boolean
          - 'null'
        auto_charge_payment_method:
          type:
          - boolean
          - 'null'
        collection_type:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptorCreateRequestCollectionType'
        link:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptorLink'
        adyen:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptorAdyen'
      title: PaymentGatewayPaymentAcceptorCreateRequest
    DataExportIntegration:
      type: object
      properties:
        variant:
          $ref: '#/components/schemas/DataExportIntegrationVariant'
          description: The variant of payment integration.
        s3:
          $ref: '#/components/schemas/S3'
        bigquery:
          $ref: '#/components/schemas/BigQuery'
        gcs:
          $ref: '#/components/schemas/Gcs'
        snowflake:
          $ref: '#/components/schemas/Snowflake'
        transport_type:
          type:
          - string
          - 'null'
      title: DataExportIntegration
    PaymentAcceptorUpdateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        billing_entity_id:
          type:
          - string
          - 'null'
          description: Resource ID of type BILLING_ENTITY
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
        reference:
          type: string
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/PaymentAcceptorUpdateRequestType'
          - type: 'null'
        bank_account:
          $ref: '#/components/schemas/BankAccount'
        payment_gateway:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptor'
        custom_redirect:
          $ref: '#/components/schemas/PaymentAcceptorCustomRedirect'
        status:
          oneOf:
          - $ref: '#/components/schemas/PaymentAcceptorUpdateRequestStatus'
          - type: 'null'
      title: PaymentAcceptorUpdateRequest
    IntegrationLinkedResourceConfiguration:
      type: object
      properties:
        resource_type:
          type: string
        link_details:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationLinkDetail'
      title: IntegrationLinkedResourceConfiguration
    UsernamePassword:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      title: UsernamePassword
    PaymentAcceptorPaymentMethodOptions:
      type: object
      properties:
        payment_acceptor:
          $ref: '#/components/schemas/PaymentAcceptor'
        integration:
          $ref: '#/components/schemas/Integration'
        options:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodOption'
      title: PaymentAcceptorPaymentMethodOptions
    AuthenticationSettings:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/AuthenticationSettingsApiKey'
        client_credentials:
          $ref: '#/components/schemas/ClientCredentials'
        username_password:
          $ref: '#/components/schemas/UsernamePassword'
      title: AuthenticationSettings
    S3:
      type: object
      properties:
        bucket_name:
          type: string
        bucket_path:
          type: string
        bucket_region:
          type: string
        authentication_type:
          oneOf:
          - $ref: '#/components/schemas/S3AuthenticationType'
          - type: 'null'
        role_arn:
          type:
          - string
          - 'null'
        external_id:
          type:
          - string
          - 'null'
      title: S3
    PaymentAcceptorCustomRedirectCreateRequest:
      type: object
      properties:
        url:
          type:
          - string
          - 'null'
      title: PaymentAcceptorCustomRedirectCreateRequest
    AdyenPaymentGatewayIntegration:
      type: object
      properties:
        company_account:
          type: string
        environment:
          $ref: '#/components/schemas/AdyenPaymentGatewayIntegrationEnvironment'
        live_prefix:
          type: string
        merchant_accounts:
          type: array
          items:
            type: string
        public_key:
          type: string
        signing_secret:
          type: string
        ownership:
          $ref: '#/components/schemas/AdyenPaymentGatewayIntegrationOwnership'
        system_ownership_details:
          $ref: '#/components/schemas/SystemOwnershipDetails'
        balance_platform_details:
          $ref: '#/components/schemas/BalancePlatformDetails'
        legal_entity_manager_details:
          $ref: '#/components/schemas/LegalEntityManagerDetails'
        enabled_payment_methods:
          type:
          - array
          - 'null'
          items:
            type: string
      title: AdyenPaymentGatewayIntegration
    EmailProviderIntegration:
      type: object
      properties:
        variant:
          $ref: '#/components/schemas/EmailProviderIntegrationVariant'
          description: The variant of email provider integration.
        mailgun:
          $ref: '#/components/schemas/MailgunEmailProvider'
          description: Mailgun-specific provider settings. Applicable when variant is MAILGUN.
        delivery_window:
          $ref: '#/components/schemas/Period'
          description: Optional delivery window configuration that limits when outbound emails may be sent.
        use_localized_templates:
          type:
          - boolean
          - 'null'
          description: Whether localized email templates should be selected based on customer or request locale when available.
      title: EmailProviderIntegration
    UKLocal:
      type: object
      properties:
        account_number:
          type:
          - string
          - 'null'
          description: A bank account number if IBAN is not used, e.g a USA or UK bank account number
        sort_code:
          type:
          - string
          - 'null'
      title: UKLocal
    PaymentAcceptorCreateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        billing_entity_id:
          type:
          - string
          - 'null'
          description: Resource ID of type BILLING_ENTITY
        customer_id:
          type:
          - string
          - 'null'
          description: Resource ID of type CUSTOMER
        reference:
          type: string
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/PaymentAcceptorCreateRequestType'
          - type: 'null'
        bank_account:
          $ref: '#/components/schemas/BankAccountCreateRequest'
        payment_gateway:
          $ref: '#/components/schemas/PaymentGatewayPaymentAcceptorCreateRequest'
        custom_redirect:
          $ref: '#/components/schemas/PaymentAcceptorCustomRedirectCreateRequest'

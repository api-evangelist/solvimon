      description: Requires the REPORT_SUBSCRIPTION.VIEW permission.
      tags:
      - reportSubscriptions
      parameters:
      - name: version
        in: path
        description: version
        required: true
        schema:
          type: string
          default: '1'
      - name: resourceId
        in: path

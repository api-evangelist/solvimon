      enum:
      - DAY
      - WEEK
      - MONTH
      - YEAR
      title: PeriodType
    QuoteVersionTemplateCreateRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/QuoteVersionContent'
          description: Content of the quote version.
        document_ids:
          type:

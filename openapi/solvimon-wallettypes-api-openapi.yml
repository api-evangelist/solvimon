components:
  schemas:
    WalletTypeType:
      type: string
      enum:
      - CREDIT
      - BALANCE
      title: WalletTypeType
    WalletTypeBalance:
      type: object
      properties:
        default_currency:
          type: string
          description: The default currency for the wallet.
      title: WalletTypeBalance
    WalletTypeCreditUpdateRequestGrantType:
      type: string
      enum:
      - CREDITS
      - AMOUNT
      title: WalletTypeCreditUpdateRequestGrantType
    WalletTypeCreditCreditsGrant:
      type: object
      properties:
        credit_type_id:
          type: string
          description: The credit type for wallets of wallet type.
      title: WalletTypeCreditCreditsGrant
    WalletTypeCreditCreateRequest:
      type: object
      properties:
        grant_type:
          $ref: '#/components/schemas/WalletTypeCreditCreateRequestGrantType'
        amount_grant:
          $ref: '#/components/schemas/WalletTypeCreditAmountGrant'
        credits_grant:
          $ref: '#/components/schemas/WalletTypeCreditCreditsGrant'
      title: WalletTypeCreditCreateRequest
    WalletTypeBalanceUpdateRequest:
      type: object
      properties:
        default_currency:
          type: string
          description: The default currency for the wallet.
      title: WalletTypeBalanceUpdateRequest
    WalletTypeCreateRequestType:
      type: string
      enum:
      - CREDIT
      - BALANCE
      title: WalletTypeCreateRequestType
    WalletType:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        status:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeStatus'
          - type: 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeType'
          - type: 'null'
        credit:
          $ref: '#/components/schemas/WalletTypeCredit'
        balance:
          $ref: '#/components/schemas/WalletTypeBalance'
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
      title: WalletType
    WalletTypeCreditAmountGrantTaxCategory:
      type: string
      enum:
      - STANDARD
      - NO_TAX
      - EXEMPT
      description: The tax category to for what the wallet can be applied to.
      title: WalletTypeCreditAmountGrantTaxCategory
    WalletTypeUpdateRequestType:
      type: string
      enum:
      - CREDIT
      - BALANCE
      title: WalletTypeUpdateRequestType
    WalletTypeCreditAmountGrant:
      type: object
      properties:
        default_currency:
          $ref: '#/components/schemas/WalletTypeCreditAmountGrantDefaultCurrency'
          description: The default currency for the wallet.
        tax_category:
          $ref: '#/components/schemas/WalletTypeCreditAmountGrantTaxCategory'
          description: The tax category to for what the wallet can be applied to.
      title: WalletTypeCreditAmountGrant
    WalletTypeCredit:
      type: object
      properties:
        grant_type:
          $ref: '#/components/schemas/WalletTypeCreditGrantType'
        amount_grant:
          $ref: '#/components/schemas/WalletTypeCreditAmountGrant'
        credits_grant:
          $ref: '#/components/schemas/WalletTypeCreditCreditsGrant'
      title: WalletTypeCredit
    WalletTypeCreateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        status:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeCreateRequestStatus'
          - type: 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeCreateRequestType'
          - type: 'null'
        credit:
          $ref: '#/components/schemas/WalletTypeCreditCreateRequest'
        balance:
          $ref: '#/components/schemas/WalletTypeBalanceCreateRequest'
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
      required:
      - name
      - reference
      - type
      title: WalletTypeCreateRequest
    WalletTypeUpdateRequest:
      type: object
      properties:
        object_type:
          type:
          - string
          - 'null'
        id:
          type:
          - string
          - 'null'
        name:
          type: string
        reference:
          type: string
        status:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeUpdateRequestStatus'
          - type: 'null'
        type:
          oneOf:
          - $ref: '#/components/schemas/WalletTypeUpdateRequestType'
          - type: 'null'
        credit:
          $ref: '#/components/schemas/WalletTypeCreditUpdateRequest'
        balance:
          $ref: '#/components/schemas/WalletTypeBalanceUpdateRequest'
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
      title: WalletTypeUpdateRequest
    WalletTypeStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - INACTIVE
      - DEPRECATED
      - ARCHIVED
      title: WalletTypeStatus
    WalletTypeUpdateRequestStatus:
      type: string
      enum:
      - DRAFT
      - ACTIVE
      - INACTIVE
      - DEPRECATED
      - ARCHIVED
      title: WalletTypeUpdateRequestStatus
    WalletTypeCreditGrantType:
      type: string
      enum:
      - CREDITS
      - AMOUNT
      title: WalletTypeCreditGrantType
    ApiErrorType:
      type: string
      enum:
      - API_ERROR
      - INVALID_REQUEST
      title: ApiErrorType
    WalletTypeCreditCreateRequestGrantType:
      type: string
      enum:
      - CREDITS
      - AMOUNT
      title: WalletTypeCreditCreateRequestGrantType
    ApiError:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ApiErrorType'
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        field:
          type:
          - string
          - 'null'
        message:
          type: string
        resource_id:
          type:
          - string
          - 'null'
        resource_type:
          oneOf:
          - $ref: '#/components/schemas/ApiErrorResourceType'
          - type: 'null'
      required:
      - type
      - code
      - message
      title: ApiError
    WalletTypeCreditUpdateRequest:
      type: object
      properties:
        grant_type:
          $ref: '#/components/schemas/WalletTypeCreditUpdateRequestGrantType'
        amount_grant:
          $ref: '#/components/schemas/WalletTypeCreditAmountGrant'

                $ref: '#/components/schemas/ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v{version}/wallet-types/{resourceIdOrReference}/deactivate:
    post:
      operationId: postWalletTypesByResourceIdOrReferenceDeactivate

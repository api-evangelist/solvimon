      title: ApiErrorResourceType
    TaxIdTypeResponseAllowedTypesItems:
      type: string
      enum:
      - GENERIC_TAX_ID
      - AU_GST
      - CA_GST_HST
      - CA_PST
      - CA_PST_BC
      - CA_PST_MB
      - CA_PST_SK
      - CA_QST
      title: TaxIdTypeResponseAllowedTypesItems
    ApiErrorCode:
      type: string
      enum:
      - RESOURCE_NOT_FOUND
      - RESOURCES_NOT_FOUND
      - UNABLE_TO_PROCESS_INSTRUCTIONS
      - BAD_REQUEST
      - UNSUPPORTED_MEDIA_TYPE
      - RESOURCE_ALREADY_EXISTS
      - CUSTOM_FIELD_VALUE_ALREADY_EXISTS
      - COULD_NOT_CREATE_RESOURCE
